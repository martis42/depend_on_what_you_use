name: CI

on:
  pull_request:
  workflow_call:

permissions: read-all

jobs:
  formatting-and-linting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  unit-tests:
    runs-on: ubuntu-24.04
    needs: [ formatting-and-linting ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run unit tests
        run: bazel test //...

  sub-workspaces-tests:
    runs-on: ubuntu-24.04
    needs: [ formatting-and-linting ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Aspect integration tests scripts unit tests
        run: ./scripts/test_aspect_tests_scripts.sh
      - name: Build examples
        run: ./scripts/build_examples.sh

  quality-checks:
    runs-on: ubuntu-24.04
    needs: [ formatting-and-linting ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Execute DWYU
        run: bazel build --config=dwyu //dwyu/...
      - name: Execute clang-tidy
        run: bazel build --config=clang_tidy //dwyu/...
      - name: Ensure C++11 compatibility
        run: ./scripts/ensure_cpp11_compatibility.sh

  sanitizers:
    runs-on: ubuntu-24.04
    needs: [ formatting-and-linting ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Cache created by the weekly 'sanitizer_cache.yaml' workflow on main. We only restore, never save.
      - name: Restore Bazel disk cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-disk-cache
          key: bazel-sanitizer-disk-cache-${{ runner.os }}-unused
          restore-keys: bazel-sanitizer-disk-cache-${{ runner.os }}-
          fail-on-cache-miss: false
      - name: Execute sanitizers
        run: bazel test --config=sanitize --disk_cache=$HOME/.cache/bazel-disk-cache //dwyu/...

  integration-tests-workspace_integration:
    runs-on: ubuntu-24.04
    needs: [ formatting-and-linting ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Integration tests - Workspace integration
        run: python test/workspace_integration/test.py

  integration-tests-examples:
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-15, windows-2022 ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    needs: [ formatting-and-linting ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Integration tests - Examples
        run: python examples/test.py

  integration-tests-aspect:
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-15, windows-2022 ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    needs: [ formatting-and-linting ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Integration tests - Aspect
        if: runner.os != 'Windows'
        run: python test/aspect/execute_tests.py --no_output_base
      - name: Integration tests - Aspect
        if: runner.os == 'Windows'
        run: python test/aspect/execute_tests.py --only-default-version --no_output_base

  integration-tests-apply-fixes:
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-15, windows-2022 ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    needs: [ formatting-and-linting ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Integration tests - Applying fixes
        run: python test/apply_fixes/execute_tests.py

  # Single stable status check to depend on in branch protection, instead of every individual (and matrix-expanded) job.
  # This makes it easier and less error prone to maintain branch protection rules.
  all-checks-passed:
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - formatting-and-linting
      - unit-tests
      - sub-workspaces-tests
      - quality-checks
      - sanitizers
      - integration-tests-workspace_integration
      - integration-tests-examples
      - integration-tests-aspect
      - integration-tests-apply-fixes
    steps:
      - name: Verify all required jobs succeeded
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [[ "$result" != "success" ]]; then
              echo "A required job did not succeed (result: $result)."
              exit 1
            fi
          done
