name: Release

on:
  # Automatically trigger a release when a release tag is pushed.
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: read-all

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    # Ensure we have a 100% green build before releasing something
    needs: [ ci ]
    permissions:
      attestations: write
      contents: write
      id-token: write
    # Cannot be SHA-pinned since the slsa-verifier rejects SHA-pinned builder refs in the SLSA provenance
    # This breaks BCR publishing, see https://github.com/bazel-contrib/publish-to-bcr/issues/263
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      # The publish workflow requires a draft release to upload the attestations, see https://github.com/bazel-contrib/publish-to-bcr#immutable-releases
      draft: true
      # We use 'prerelease' to mark the release deployment is still "work in progress".
      # We can't use draft releases for that, since this does not work together with the BCR deployment process requiring access to the release artifacts.
      prerelease: true
      generate_release_notes: true
      release_files: depend_on_what_you_use-*.tar.gz
      tag_name: ${{ github.ref_name }}
      # The code has already been tested before we start the release process
      bazel_test_command: "/bin/true"
      mount_bazel_caches: false

  publish:
    needs: [ release ]
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ github.ref_name }}
      release_artifacts_run_id: ${{ github.run_id }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}

  add-bcr-pr-to-release-notes:
    needs: [ publish ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Add BCR pull request to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/release_add_bcr_pr.py --tag "${{ github.ref_name }}" --repo "${{ github.repository }}"

  publish-release:
    needs: [ add-bcr-pr-to-release-notes ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish the release but keep it marked as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/release_publish.py --tag "${{ github.ref_name }}" --repo "${{ github.repository }}"

  # The BCR needs to be able to download the release artifacts, thus the release must be published before the BCR deployment is made ready.
  ready-bcr-pr:
    needs: [ publish-release ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Mark the BCR deployment PR as ready for review
        env:
          # The default token has no permissions for the BCR repository
          GH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
        run: ./.github/scripts/release_ready_bcr_pr.py --tag "${{ github.ref_name }}"
